name: grove-port

on:
  push:
    paths:
      - 'grove-port/**'
      - '.github/workflows/grove-port-ci.yml'
  pull_request:
    paths:
      - 'grove-port/**'
      - '.github/workflows/grove-port-ci.yml'

permissions:
  contents: read

concurrency:
  group: grove-port-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: grove-port

jobs:
  test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Frozen so a drifted lockfile fails here rather than resolving silently.
      #
      # Exception: Dependabot cannot parse or update bun.lock, so it edits
      # package.json alone. A frozen install then fails on "lockfile had
      # changes" and tells us nothing about whether the bump actually works.
      # Install unfrozen for its PRs so CI reports the real answer; the stale
      # lockfile still has to be regenerated before any of them can merge.
      - name: Install
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "Dependabot PR — installing unfrozen (bun.lock is not Dependabot-maintained)"
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Build (schema → core → adapters → CLI)
        run: bun run build

      - name: Typecheck
        run: bunx tsc -p tsconfig.test.json --noEmit

      - name: Test
        run: bun test

      # A tsconfig missing `exclude: src/**/*.test.ts` compiles tests into dist,
      # where they run as a stale second copy of the suite and ship in the package.
      - name: Fail if compiled tests leaked into dist
        run: |
          leaked=$(find packages apps -path '*/dist/*' -name '*.test.*' -print)
          if [ -n "$leaked" ]; then
            echo "Compiled test files must not ship in dist/:"
            echo "$leaked"
            exit 1
          fi
