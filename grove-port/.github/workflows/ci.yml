name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build (schema → core → adapters → CLI)
        run: bun run build

      - name: Typecheck
        run: bunx tsc -p tsconfig.test.json --noEmit

      - name: Test
        run: bun test

      - name: Fail if compiled tests leaked into dist
        run: |
          leaked=$(find packages apps -path '*/dist/*' -name '*.test.*' -print)
          if [ -n "$leaked" ]; then
            echo "Compiled test files must not ship in dist/:"
            echo "$leaked"
            exit 1
          fi
